# Release manual (workflow_dispatch): build ofuscado con garble + tests Go
# sobre el binario + artifact sin firmar.
#
# SIN firma digital a proposito: SignPath Foundation se DESCARTO para este
# proyecto. El binario se distribuye como artifact de GitHub; quien quiera
# verificarlo tiene el fuente publico (mismo commit).
#
# Uso: Actions > Release > Run workflow > version (p.ej. 1.0.0).

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version a imprimir con --version (p.ej. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: garble (build ofuscado)
        run: go install mvdan.cc/garble@latest

      - name: build release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          # la version NUNCA se interpola en el script (inyeccion de shell
          # via workflow_dispatch): se valida como variable de entorno
          if ($env:RELEASE_VERSION -notmatch '^[0-9][0-9A-Za-z.\-+]{0,31}$') {
            Write-Host "version invalida (usa p.ej. 1.0.0): $env:RELEASE_VERSION"; exit 1
          }
          $ld = "-s -w -X main.version=$env:RELEASE_VERSION -X main.buildDate=$(Get-Date -Format yyyy-MM-dd)"
          garble -literals -tiny -seed=random build -trimpath -ldflags $ld -o ProxyGateway.exe .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\ProxyGateway.exe --version

      - name: tests Go sobre el binario
        run: go test -race -count=1 ./...

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyGateway-${{ inputs.version }}
          path: ProxyGateway.exe
          if-no-files-found: error
