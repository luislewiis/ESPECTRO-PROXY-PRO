name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) { Write-Host "sin formatear:"; $bad; exit 1 }

      - name: go vet
        run: go vet ./...

      - name: tests Go (unit + race)
        run: go test -race -count=1 ./...

      - name: build
        run: go build -o ProxyGateway.exe .

      - name: suite funcional (19)
        run: python tests/run_tests.py

      - name: Snyk (SCA bloquea, CODE avisa)
        shell: pwsh
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if (-not $env:SNYK_TOKEN) {
            Write-Host "sin SNYK_TOKEN: Snyk omitido"
            exit 0
          }
          npm install -g snyk
          snyk code test --severity-threshold=high
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Snyk Code: issues HIGH abiertos. Los 3 actuales son FPs auditados y aceptados; Consistent Ignores (ignore via CLI) no esta habilitado en este plan de Snyk."
          }
          snyk test --fail-on=all
          exit $LASTEXITCODE
